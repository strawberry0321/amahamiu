<!DOCTYPE html>
<!-- 文档类型声明：告诉浏览器这是 HTML5 文档 -->
<html lang="zh-CN">
<!-- lang="zh-CN"：声明页面语言为简体中文，利于搜索引擎和无障碍阅读 -->

<head>
    <!-- 头部区域：存放页面的元信息，不会显示在页面正文中 -->

    <meta charset="UTF-8">
    <!-- 字符编码：使用 UTF-8，保证中文等字符正常显示，避免乱码 -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 视口设置：让页面宽度适配设备屏幕宽度，初始缩放为 1.0，是移动端适配的基础 -->

    <title>My Page</title>
    <!-- 页面标题：显示在浏览器标签页上，也是搜索结果的标题 -->

    <style>
        /* 内嵌样式表：存放页面的所有 CSS 样式 */

        html {
            height: 100%;   /* 保证渐变背景可以铺满整个视口 */
        }

        body {
            margin: 0;      /* 清除浏览器默认的外边距，避免页面四周出现白边 */
            min-height: 100%;   /* 占满整个视口高度 */
            padding: 0;     /* 清除浏览器默认的内边距 */
            /* 粉色渐变背景：以 #F4C0D2 为主色，向浅粉/深粉过渡，色块放大 4 倍便于位移动画 */
            background: linear-gradient(-45deg, #F4C0D2, #FADCE6, #F4C0D2, #F7A8C4);
            background-size: 400% 400%;
            animation: breathing 8s ease-in-out infinite;   /* 应用呼吸动画：8 秒一个周期，循环播放 */
            overflow: hidden;   /* 隐藏溢出内容，防止星星粒子飘出边界时产生滚动条 */
            display: flex;      /* 弹性布局：让按钮在页面正中央居中 */
            align-items: center;
            justify-content: center;
        }

        /* 呼吸动画关键帧：渐变在背景上缓慢往复流动，配合 ease-in-out 缓动呈现“吸气-呼气”般的呼吸节奏 */
        @keyframes breathing {
            0%, 100% { background-position: 0% 50%; }   /* 起始与结束状态一致，保证循环平滑 */
            50%      { background-position: 100% 50%; } /* 中点达到最远位置，形成往复效果 */
        }

        #starfield {
            position: fixed;    /* 相对视口固定定位，不随页面滚动 */
            top: 0;             /* 铺满整个视口 */
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;   /* 让鼠标点击/悬停穿透画布，不影响未来页面内容的交互 */
            z-index: 1;         /* 悬浮在渐变背景之上；未来添加的正文内容请使用更高的 z-index */
        }

        #dust {
            position: fixed;    /* 星尘画布同样铺满整个视口 */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;   /* 不拦截任何鼠标事件，只负责绘制 */
            z-index: 2;         /* 位于星星之上、与按钮同层（DOM 顺序在按钮之前，不会遮挡按钮） */
        }

        .home-button {
            /* 圆形图片按钮：无边框、无背景，仅显示图片本身 */
            border: none;           /* 无边框样式 */
            outline: none;          /* 去除点击/聚焦时的默认轮廓线 */
            background: transparent;    /* 按钮本体透明，只露出图片 */
            padding: 0;             /* 清除按钮默认内边距 */
            cursor: pointer;        /* 鼠标悬浮时显示手型指针，提示可点击 */
            display: block;
            width: 180px;           /* 按钮直径 */
            height: 180px;
            border-radius: 50%;     /* 裁剪为圆形 */
            overflow: hidden;       /* 图片超出圆形范围的部分被裁掉 */
            z-index: 2;             /* 位于星星画布之上 */
            transition: transform 0.25s ease;   /* 缩放/位移变化时平滑过渡 */
            will-change: transform;             /* 提示浏览器为 transform 动画做性能优化 */
        }

        .home-button img {
            width: 100%;            /* 图片铺满按钮圆形区域 */
            height: 100%;
            object-fit: cover;      /* 保持图片比例居中裁剪填满圆形 */
            display: block;
            border-radius: 50%;
            pointer-events: none;   /* 让指针事件落在按钮上而非图片上，保证晃动计算稳定 */
        }

        /* ===== 加载动画 ===== */

        #loading {
            position: fixed;    /* 覆盖整个视口 */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;        /* 压在所有内容（含按钮、星星）之上 */
            display: flex;      /* 字母组水平垂直居中 */
            align-items: center;
            justify-content: center;
            /* 背景与页面主体一致，过渡时视觉上无缝衔接 */
            background: linear-gradient(-45deg, #F4C0D2, #FADCE6, #F4C0D2, #F7A8C4);
            background-size: 400% 400%;
            animation: breathing 8s ease-in-out infinite;
            transition: opacity 0.6s ease;  /* 加载完成后淡出 */
        }

        #loading.hidden {
            opacity: 0;             /* 淡出至完全透明 */
            pointer-events: none;   /* 淡出后不再拦截鼠标事件 */
        }

        #loading span {
            display: inline-block;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            font-size: 2.6rem;          /* 字母大小 */
            font-weight: 700;
            color: #ffffff;             /* 白色字母 */
            text-shadow: 0 2px 12px rgba(214, 100, 148, 0.55);  /* 粉色柔和投影，增加立体感 */
            margin: 0 2px;              /* 字母间距 */
            animation: sway 1.1s ease-in-out infinite;  /* 晃动动画：1.1 秒一个周期 */
            /* 依次从左到右错开启动：每个字母比前一个晚 0.12 秒 */
            animation-delay: calc(var(--i) * 0.12s);
        }

        /* 晃动关键帧：左右摆动并伴随轻微上下起伏，呈"摇头晃脑"的效果 */
        @keyframes sway {
            0%, 100% { transform: rotate(0deg) translateY(0); }
            25%      { transform: rotate(-10deg) translateY(-6px); }    /* 向左歪并上抬 */
            75%      { transform: rotate(10deg) translateY(6px); }      /* 向右歪并下沉 */
        }
    </style>
</head>

<body>
    <!-- 主体区域：页面的可见内容都写在这里 -->

    <div id="loading">
        <!-- 加载动画遮罩：JS 会把 "AmahaMiu" 拆成单个字母并依次错峰晃动，加载完成后淡出移除 -->
    </div>

    <canvas id="starfield"></canvas>
    <!-- 星星粒子画布：用于绘制漂浮闪烁的星星粒子 -->

    <canvas id="dust"></canvas>
    <!-- 星尘画布：绘制鼠标轨迹的金黄色星尘粒子 -->

    <a id="homeButton" class="home-button" href="home.html" title="进入主页">
        <!-- 圆形图片按钮：点击跳转到主页 home.html -->
        <img src="image/20072112EFA5C1932D3A5C56CFCC45F1.png" alt="进入主页">
    </a>

    <script>
        // 星星粒子脚本：生成随机星星，让它们缓慢漂浮并周期性闪烁
        (function () {
            'use strict';

            const canvas = document.getElementById('starfield');
            const ctx = canvas.getContext('2d');
            let stars = [];

            // 星星密度：每 9000 平方像素约 1 颗星星，屏幕越大星星越多
            const DENSITY = 9000;

            // 创建星星：每颗星星拥有随机的大小、亮度、闪烁速度、相位和漂浮速度
            function createStars() {
                const count = Math.floor(canvas.width * canvas.height / DENSITY);
                stars = Array.from({ length: count }, function () {
                    return {
                        x: Math.random() * canvas.width,        // 初始横向位置
                        y: Math.random() * canvas.height,       // 初始纵向位置
                        r: Math.random() * 2.4 + 1.2,           // 星星半径：1.2 ~ 3.6 像素（加大尺寸，保证在粉色背景上清晰可见）
                        baseAlpha: Math.random() * 0.5 + 0.3,   // 基础亮度：0.3 ~ 0.8
                        twinkleSpeed: Math.random() * 1.5 + 0.5,    // 闪烁速度：每颗各不相同
                        phase: Math.random() * Math.PI * 2,     // 闪烁相位：错开起始时间，避免整齐划一
                        vx: (Math.random() - 0.5) * 0.15,       // 横向漂移速度：缓慢左右摇摆
                        vy: -(Math.random() * 0.2 + 0.05)       // 纵向速度：整体缓缓向上漂浮
                    };
                });
            }

            // 调整画布尺寸以匹配窗口，并在窗口变化时重建星星
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                createStars();
            }

            // 绘制单颗星星：透明度按正弦规律周期变化，产生闪烁效果
            function drawStar(star, time) {
                const twinkle = 0.5 + 0.5 * Math.sin(time * 0.001 * star.twinkleSpeed + star.phase);
                const alpha = star.baseAlpha * (0.35 + 0.65 * twinkle); // 亮度最低保持 35%，避免星星完全消失

                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, ' + alpha.toFixed(3) + ')';
                ctx.shadowBlur = star.r * 4;                    // 光晕半径与星星大小成正比
                ctx.shadowColor = 'rgba(255, 255, 255, ' + (alpha * 0.8).toFixed(3) + ')';
                ctx.fill();
                ctx.shadowBlur = 0;                             // 清除光晕设置，避免影响下一颗星星
            }

            // 主循环：每帧清空画布 → 更新星星位置（越界则从另一侧回归）→ 重新绘制
            function animate(time) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                stars.forEach(function (star) {
                    star.x += star.vx;
                    star.y += star.vy;

                    // 边缘环绕：飘出边界的星星从对侧重新进入，保证画面始终有星星
                    if (star.y < -5) { star.y = canvas.height + 5; }
                    if (star.x < -5) { star.x = canvas.width + 5; }
                    if (star.x > canvas.width + 5) { star.x = -5; }

                    drawStar(star, time);
                });

                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', resize);
            resize();
            requestAnimationFrame(animate);
        })();
    </script>

    <script>
        // 按钮悬浮交互：指针悬浮时图片放大，并随指针在图片内的上下位置晃动侧重位置
        (function () {
            'use strict';

            const btn = document.getElementById('homeButton');
            const MAX_SHIFT = 8;    // 晃动最大位移：8 像素
            const SCALE = 1.08;     // 悬浮时放大的倍数

            // 指针在按钮内移动时，计算指针的相对纵向位置（0=顶部，1=底部），
            // 让图片向指针所在的一侧偏移，形成"侧重位置晃动"的效果
            btn.addEventListener('mousemove', function (e) {
                const rect = btn.getBoundingClientRect();
                const relY = (e.clientY - rect.top) / rect.height;   // 指针纵向相对位置
                const offsetY = (relY - 0.5) * 2 * MAX_SHIFT;        // 顶部为负（上移），底部为正（下移）
                btn.style.transform = 'scale(' + SCALE + ') translateY(' + offsetY.toFixed(2) + 'px)';
            });

            // 指针离开时恢复原始大小和位置（transition 提供平滑回落）
            btn.addEventListener('mouseleave', function () {
                btn.style.transform = 'scale(1) translateY(0)';
            });
        })();
    </script>
    <script>
        // 加载动画脚本：生成 "AmahaMiu" 字母（从左到右依次错峰晃动），页面加载完成后淡出
        (function () {
            'use strict';

            const loading = document.getElementById('loading');
            const TEXT = 'AmahaMiu';
            const MIN_SHOW = 1500;  // 最短展示时长（毫秒），保证动画能被看到

            // 把文字拆成单个字母，每个字母带递增的 --i 变量用于错峰延迟
            TEXT.split('').forEach(function (ch, i) {
                const span = document.createElement('span');
                span.textContent = ch;
                span.style.setProperty('--i', i);
                loading.appendChild(span);
            });

            // 页面资源加载完毕后，至少展示 MIN_SHOW 毫秒再淡出，随后从 DOM 中移除遮罩
            window.addEventListener('load', function () {
                setTimeout(function () {
                    loading.classList.add('hidden');
                    setTimeout(function () {
                        loading.remove();
                    }, 700);    // 等待 0.6s 淡出过渡结束后再移除节点
                }, MIN_SHOW);
            });
        })();
    </script>
    <script>
        // 鼠标星尘脚本：鼠标移动时在轨迹上洒出金黄色星尘粒子，渐变缩小并淡出消散
        (function () {
            'use strict';

            const canvas = document.getElementById('dust');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let lastX = null, lastY = null;     // 上一次洒落点，用于在两次移动之间插值补齐轨迹
            const MAX_PARTICLES = 600;          // 粒子上限，防止性能问题

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            // 在指定位置洒出一批星尘粒子：位置、速度、大小、色相（金黄区间）均带随机扰动
            function spawnDust(x, y) {
                if (particles.length >= MAX_PARTICLES) { return; }
                const count = 3 + Math.floor(Math.random() * 2);    // 每个落点洒出 3~4 颗
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: x + (Math.random() - 0.5) * 12,          // 在指针附近随机散开
                        y: y + (Math.random() - 0.5) * 12,
                        vx: (Math.random() - 0.5) * 0.8,            // 横向轻微摆动
                        vy: Math.random() * 0.4,                    // 初始速度：略微向下
                        r: Math.random() * 2.5 + 1,                 // 初始半径：1 ~ 3.5 像素
                        life: 1,                                    // 剩余寿命（1 → 0）
                        decay: Math.random() * 0.006 + 0.004,       // 消散速度放缓，拖尾更绵长
                        hue: 38 + Math.random() * 16,               // 色相 38~54：金黄 → 金橙渐变
                        light: 58 + Math.random() * 14              // 亮度随机，形成深浅渐变层次
                    });
                }
            }

            // 从上一次落点到当前位置逐点插值洒落，保证快速移动时轨迹依然连续不断
            function trail(x, y) {
                if (lastX === null) {
                    spawnDust(x, y);
                } else {
                    const dist = Math.hypot(x - lastX, y - lastY);
                    const steps = Math.max(1, Math.floor(dist / 14));   // 每隔约 14px 补一个落点
                    for (let i = 1; i <= steps; i++) {
                        spawnDust(lastX + (x - lastX) * i / steps, lastY + (y - lastY) * i / steps);
                    }
                }
                lastX = x;
                lastY = y;
            }

            function animate() {
                // 每帧清空画布后重绘，粒子透明度随寿命递减形成渐隐
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'lighter';   // 叠加发光模式，星尘重叠处更亮

                particles = particles.filter(function (p) {
                    p.vy += 0.045;      // 重力加速度：粒子逐渐加速向下坠落
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= p.decay;

                    // 触底消失：粒子坠落到画布最底部时立即移除
                    if (p.y >= canvas.height - p.r) { return false; }
                    if (p.life <= 0) { return false; }

                    const alpha = p.life;                           // 透明度随寿命渐隐
                    const radius = p.r * (0.4 + 0.6 * p.life);      // 半径随寿命缩小

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                    // 金黄色渐变：中心亮白偏金，边缘转为金橙，随寿命逐渐变暗
                    const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radius * 2.2);
                    grd.addColorStop(0, 'hsla(' + p.hue + ', 100%, ' + (p.light + 22) + '%, ' + alpha + ')');
                    grd.addColorStop(0.45, 'hsla(' + p.hue + ', 100%, ' + p.light + '%, ' + (alpha * 0.85) + ')');
                    grd.addColorStop(1, 'hsla(' + (p.hue - 6) + ', 95%, 48%, 0)');
                    ctx.fillStyle = grd;
                    ctx.fill();
                    return true;
                });

                ctx.globalCompositeOperation = 'source-over';
                requestAnimationFrame(animate);
            }

            // 监听全页鼠标移动：沿轨迹插值洒出星尘
            document.addEventListener('mousemove', function (e) {
                trail(e.clientX, e.clientY);
            });

            window.addEventListener('resize', resize);
            resize();
            requestAnimationFrame(animate);
        })();
    </script>
</body>
</html>
